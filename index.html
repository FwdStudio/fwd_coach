<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fwd Coach">
<meta name="theme-color" content="#0b8f45">
<title>Fwd Coach</title>
<style>
:root{--bg:#e6f6ec;--card:#fff;--tx:#10231a;--mut:#4f6a5a;--ac:#0b8f45;--line:#bfe3cb;--bad:#e5383b;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0a1510;--card:#14231b;--tx:#eaf7ef;--mut:#9fc2ad;--ac:#34d399;--line:#26452f}}
*{box-sizing:border-box}
body{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
html,body{margin:0;overflow:hidden;background:var(--card);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
#top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 10px;background:linear-gradient(135deg,#0b8f45,#14b8a6)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#fff;padding:0 4px 6px}
.hd b{font-size:20px;font-family:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.2px}
.hd span{font-size:14px;font-weight:600}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.2);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:700;font-size:14px;padding:9px 4px;border-radius:9px}
.tabs button.on{background:#fff;color:#0b6e36}
#stage{flex:1;min-height:0;position:relative;margin-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.view{position:absolute;top:0;left:0;right:0;bottom:0;display:none}
.view.on{display:block}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
#v-rosa{overflow:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:12px;padding:12px;margin:0 auto 12px;max-width:640px}
h2{font-size:21px;margin:0 0 6px;font-family:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",sans-serif}
.mut{color:var(--mut);font-size:13px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:90px;font-size:12px}
button{padding:10px 14px;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:8px;font-weight:600}
button.p{background:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){button.p{color:#06140d}}
button.x{padding:6px 12px;border-color:var(--line);color:var(--mut);font-size:18px;line-height:1}
button.d{border-color:var(--bad);color:var(--bad)}
.rw{display:flex;gap:8px;margin-top:6px}
.bt{width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="top"><div class="hd"><b>Fwd Coach</b><span id="cat"></span></div><div class="tabs">
<button id="b-carico" class="on" onclick="show('carico')">Carico</button>
<button id="b-formazioni" onclick="show('formazioni')">Formazioni</button>
<button id="b-test" onclick="show('test')">Test</button>
<button id="b-rosa" onclick="show('rosa')">Rosa</button>
</div></div>
<div id="stage">
<div class="view on" id="v-carico"><iframe id="fc" title="Carico squadra"></iframe></div>
<div class="view" id="v-formazioni"><iframe id="ff" title="Formazioni"></iframe></div>
<div class="view" id="v-test"><iframe id="ft" title="Test fisici"></iframe></div>
<div class="view" id="v-rosa"></div>
</div>
<script>
const KM='fwd_rosa_v1',KC='carico_squadra_v1',KF='fwd_formazioni_u14_v1',KT='fwd_test_v1';
const $=id=>document.getElementById(id);
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tk=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
function same(a,b){const x=tk(a),y=tk(b);if(!x.length||!y.length)return false;const[s,l]=x.length<=y.length?[x,y]:[y,x];return s.every(t=>l.includes(t))}
function find(list,name,key){
 const c=list.filter(e=>e[key]==null&&same(e.name,name));
 const ex=c.filter(e=>tk(e.name).join(' ')==tk(name).join(' '));
 return ex.length==1?ex[0]:(c.length==1?c[0]:null)}

let tab='carico';const stale={carico:false,formazioni:false,test:false},rl={carico:0,formazioni:0,test:0};
const fr={carico:$('fc'),formazioni:$('ff'),test:$('ft')};

/* Rosa condivisa: ogni ragazzo ha un id comune e il collegamento
   al proprio id dentro Carico (c) e dentro Formazioni (f). */
function readM(){const M=rd(KM);return M&&Array.isArray(M.list)?M:{list:[]}}
function syncAll(){
 const M=readM(),C=rd(KC),Fm=rd(KF),out={carico:false,formazioni:false},before=JSON.stringify(M);
 if(C&&Array.isArray(C.players))C.players.forEach(p=>{if(M.list.some(e=>e.c==p.id))return;const e=find(M.list,p.name,'c');if(e)e.c=p.id;else M.list.push({id:uid('r'),name:p.name,c:p.id})});
 if(Fm&&Array.isArray(Fm.p))Fm.p.forEach(p=>{if(M.list.some(e=>e.f==p.id))return;const e=find(M.list,p.n,'f');if(e)e.f=p.id;else M.list.push({id:uid('r'),name:p.n,f:p.id})});
 M.list.forEach(e=>{if(e.c==null)e.c=uid('p')});
 if(C||M.list.length){
  const C2=C||{cat:'Juniores',players:[],sessions:[],ref:{}},o=JSON.stringify(C2.players),np=M.list.map(e=>({id:e.c,name:e.name}));
  if(o!=JSON.stringify(np)){C2.players=np;wr(KC,C2);out.carico=true}}
 if(Fm&&Array.isArray(Fm.p)){
  const o=JSON.stringify(Fm.p),by=new Map(Fm.p.map(p=>[p.id,p]));let k=0;
  const np=M.list.map(e=>{let p=e.f!=null?by.get(e.f):null;
   if(!p){const id=Date.now()+(k++);e.f=id;p={id,n:e.name,f:1,g:false,out:false,a:Array.from({length:15},(_,i)=>i<13?5:null)}}
   if(p.s&&!same(p.s,e.name))delete p.s;
   p.n=e.name;return p});
  if(o!=JSON.stringify(np)){Fm.p=np;wr(KF,Fm);out.formazioni=true}}
 if(JSON.stringify(M)!=before)wr(KM,M);
 return out}

function fresh(t){if(!stale[t])return;stale[t]=false;try{fr[t].contentWindow.location.reload()}catch(e){fr[t].src=fr[t].src}}
function markBoth(){stale.carico=stale.formazioni=stale.test=true}
addEventListener('message',e=>{const d=e.data;if(d&&d.fwd=='stale'&&d.m in stale)stale[d.m]=true});
function inject(f,n){try{const d=f.contentDocument;if(!d||d.getElementById('shx'))return;const s=d.createElement('style');s.id='shx';
 s.textContent='h1{display:none!important}.card:has(#rosa){display:none!important}nav{padding-bottom:0!important}'+(n=='carico'?'body{padding-bottom:72px!important}':'');d.head.appendChild(s)}catch(e){}}
function onLoad(n){inject(fr[n],n);updCat();const o=syncAll();if(o.carico)stale.carico=true;if(o.formazioni)stale.formazioni=true;
 if(tab!='rosa'&&stale[tab]&&rl[tab]++<3)fresh(tab)}
fr.carico.onload=()=>onLoad('carico');fr.formazioni.onload=()=>onLoad('formazioni');fr.test.onload=()=>onLoad('test');

function updCat(){const C=rd(KC);$('cat').textContent=C&&C.cat?C.cat:''}
addEventListener('storage',updCat);
function show(t){tab=t;updCat();
 ['carico','formazioni','test','rosa'].forEach(k=>{$('v-'+k).classList.toggle('on',k==t);$('b-'+k).classList.toggle('on',k==t)});
 if(t=='rosa')renderRosa();else fresh(t)}

/* ---- scheda Rosa ---- */
function renderRosa(){const M=readM();
 $('v-rosa').innerHTML=`<div class="card"><h2>Rosa</h2><p class="mut">Un solo elenco per Carico e Formazioni. Cambia un nome, aggiungi o togli un ragazzo qui e si aggiorna in entrambe.</p>
 ${M.list.map(e=>`<div class="rw"><input value="${esc(e.name)}" aria-label="Nome" onchange="ren('${e.id}',this.value)"><button class="x" aria-label="Elimina ${esc(e.name)}" onclick="delE('${e.id}')">×</button></div>`).join('')||'<p class="mut">Nessun ragazzo ancora: aggiungi il primo.</p>'}
 <div class="rw" style="margin-top:12px"><input id="nn" placeholder="Nome e cognome" aria-label="Nuovo ragazzo"><button class="p" onclick="addE()">Aggiungi</button></div>
 <button class="bt" onclick="sortE()">Ordina A–Z</button></div>
 <div class="card"><h2>Copia di sicurezza</h2><p class="mut">Salva rosa, sedute, voti, formazioni e test in un solo testo. Conservalo (ad esempio nelle Note). La versione aperta da Safari e quella aggiunta alla Home hanno memorie separate: per passare i dati da una all’altra usa Esporta e Importa.</p>
 <textarea id="bk" placeholder="Qui compare il testo esportato. Incolla qui per importare."></textarea>
 <button class="bt" onclick="expAll()">Esporta tutto</button><button class="bt" onclick="copyAll()">Copia negli appunti</button><button class="bt" onclick="impAll()">Importa il testo incollato</button>
 <p class="mut" id="bm"></p></div>`}
function ren(id,v){v=v.trim();const M=readM(),e=M.list.find(x=>x.id==id);if(!e)return;if(!v){renderRosa();return}
 e.name=v;wr(KM,M);syncAll();markBoth()}
function addE(){const i=$('nn'),v=i.value.trim();if(!v){i.focus();return}
 const M=readM();M.list.push({id:uid('r'),name:v});wr(KM,M);syncAll();markBoth();renderRosa()}
function sortE(){const M=readM();M.list.sort((a,b)=>a.name.localeCompare(b.name,'it'));wr(KM,M);syncAll();markBoth();renderRosa()}
function delE(id){const M=readM(),e=M.list.find(x=>x.id==id);
 if(!e||!confirm('Togliere '+e.name+' da Carico e Formazioni? Le sedute già salvate restano.'))return;
 M.list=M.list.filter(x=>x!==e);wr(KM,M);
 const C=rd(KC);if(C&&Array.isArray(C.players)){C.players=C.players.filter(p=>p.id!=e.c);wr(KC,C)}
 const Fm=rd(KF);if(Fm&&Array.isArray(Fm.p)){Fm.p=Fm.p.filter(p=>p.id!=e.f);wr(KF,Fm)}
 markBoth();renderRosa()}
const bm=t=>$('bm').textContent=t;
function expAll(){const t=$('bk');t.value=JSON.stringify({m:rd(KM),c:rd(KC),f:rd(KF),t:rd(KT)});t.select();bm('Dati esportati nel riquadro.')}
function copyAll(){expAll();(navigator.clipboard?navigator.clipboard.writeText($('bk').value):Promise.reject()).then(()=>bm('Copiato negli appunti.')).catch(()=>bm('Copia non riuscita: tieni premuto sul testo e scegli Copia.'))}
function impAll(){
 try{const j=JSON.parse($('bk').value);if(!j||typeof j!='object'||!(j.m||j.c||j.f||j.t))throw 0;
  if(!confirm('Sostituire i dati attuali con quelli incollati?'))return;
  if(j.m)wr(KM,j.m);if(j.c)wr(KC,j.c);if(j.f)wr(KF,j.f);if(j.t)wr(KT,j.t);syncAll();markBoth();renderRosa();bm('Dati importati.')}
 catch(e){bm('Testo non valido: incolla un’esportazione di questa app.')}}

/* ---- avvio ---- */
syncAll();updCat();
fr.carico.src='carico.html';fr.formazioni.src='formazioni.html';fr.test.src='test.html';

/* ---- PWA: icona e manifest ---- */
(()=>{try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
x.fillStyle='#0b8f45';x.fillRect(0,0,180,180);x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(16,16,148,148);
x.beginPath();x.moveTo(16,90);x.lineTo(164,90);x.stroke();x.beginPath();x.arc(90,90,28,0,7);x.stroke();
const u=c.toDataURL('image/png'),l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);
const m={name:'Fwd Coach',short_name:'Fwd Coach',display:'standalone',start_url:location.href,background_color:'#0b8f45',theme_color:'#0b8f45',icons:[{src:u,sizes:'180x180',type:'image/png'}]};
const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k)}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
